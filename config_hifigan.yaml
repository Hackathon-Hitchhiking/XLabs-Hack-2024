# HiFi-GAN Configuration
hifigan:
  sample_rate: 22050                 # Consistent with VITS sample rate
  upsample_rates: [8, 8, 2, 2]       # Upsampling factors (adjust for target sample rate)
  upsample_kernel_sizes: [16, 16, 4, 4]
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  num_mels: 80                       # Number of mel channels (matches VITS)

generator:
  in_channels: 80                    # Input channels (mel-spectrogram dimension)
  out_channels: 1                    # Mono output
  channels: 512                      # Model complexity; adjust if memory is limited
  kernel_size: 7
  n_layers: 6                        # Number of layers
  residual_channels: 512
  dropout: 0.1                       # Dropout to prevent overfitting
  max_text_len: 500                  # Max length to match VITS config

train:
  batch_size: 8                      # Adjust based on available memory
  learning_rate: 0.0002
  betas: [0.8, 0.99]                 # Adam optimizer betas for stability
  epochs: 200                        # Vocoder training requires more epochs
  clip_grad: 1.0                     # Gradient clipping